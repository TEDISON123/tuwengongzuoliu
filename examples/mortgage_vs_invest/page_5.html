<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .card-canvas {
      width: 540px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="card-canvas bg-white shadow-xl rounded-2xl flex flex-col justify-between p-8 border border-slate-200">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 tracking-wider">
        #理性讨论 · 财经认知
      </span>
      <span class="text-xs font-semibold text-slate-400 font-mono">
        5 / 6
      </span>
    </div>

    <div class="my-auto space-y-4">
      <!-- 专家立论看板 -->
      <div class="p-3.5 rounded-xl bg-amber-50 border-l-4 border-amber-600 space-y-1">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600">
            【反方立场】
          </span>
          <span class="text-[10px] px-2 py-0.5 rounded bg-white/80 font-bold text-amber-800 border border-amber-200">
            财富规划师与精算视角
          </span>
        </div>
        <h2 class="text-base font-black text-amber-950 leading-snug">现金是呼吸机，绝不把子弹打光</h2>
        <p class="text-[10px] text-amber-700/80 font-medium">国际认证注册理财规划师 (CFP)</p>
      </div>

      
      <div class="p-2.5 rounded-lg bg-amber-50/70 border-l-3 border-amber-500 text-[11px] text-amber-900 italic font-medium">
        💬 核心观点：“脱离流动性储备谈省利息，都是在拿家庭安全裸奔。”
      </div>


      <ul class="space-y-2.5">
        <li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-amber-100 text-amber-700 font-bold text-[10px] flex items-center justify-center mt-0.5">1</span>
              <span>流动性不可逆：房子变现周期极长，手握50万现金是抵御中年职场失业的生命线。</span>
            </li><li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-amber-100 text-amber-700 font-bold text-[10px] flex items-center justify-center mt-0.5">2</span>
              <span>久期错配陷阱：房贷是长达30年的超长资金，一旦全额填平，突遇急用钱只能借高息消费贷。</span>
            </li><li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-amber-100 text-amber-700 font-bold text-[10px] flex items-center justify-center mt-0.5">3</span>
              <span>周期底部期权：全市场缺钱时现金才是最高级期权，保留现金才能抓住未来的资产重估机会。</span>
            </li>
      </ul>
    </div>
    <div class="pt-3 border-t border-slate-100 text-right text-xs text-slate-400">P5 / 反方立论</div>

  </div>
</body>
</html>
