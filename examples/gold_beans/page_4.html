<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .card-canvas {
      width: 540px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="card-canvas bg-white shadow-xl rounded-2xl flex flex-col justify-between p-8 border border-slate-200">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 tracking-wider">
        #理性讨论 · 财经认知
      </span>
      <span class="text-xs font-semibold text-slate-400 font-mono">
        4 / 6
      </span>
    </div>

    <div class="my-auto space-y-4">
      <!-- 专家立论看板 -->
      <div class="p-3.5 rounded-xl bg-blue-50 border-l-4 border-blue-600 space-y-1">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600">
            【正方立场】
          </span>
          <span class="text-[10px] px-2 py-0.5 rounded bg-white/80 font-bold text-blue-800 border border-blue-200">
            宏观经济与周期学者
          </span>
        </div>
        <h2 class="text-base font-black text-blue-950 leading-snug">微型法币对冲，极佳的强制储蓄手段</h2>
        <p class="text-[10px] text-blue-700/80 font-medium">宏观策略首席分析师</p>
      </div>

      
      <div class="p-2.5 rounded-lg bg-blue-50/70 border-l-3 border-blue-500 text-[11px] text-blue-900 italic font-medium">
        💬 核心观点：“顺周期加杠杆是赌博，看懂央行资产负债表才是真正的降维生存。”
      </div>


      <ul class="space-y-2.5">
        <li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-blue-100 text-blue-700 font-bold text-[10px] flex items-center justify-center mt-0.5">1</span>
              <span>无痛强制储蓄：相比买包买奶茶，买金豆把浮躁消费转化为了实物硬通货。</span>
            </li><li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-blue-100 text-blue-700 font-bold text-[10px] flex items-center justify-center mt-0.5">2</span>
              <span>长周期购买力抵御：法币持续超发大背景下，黄金穿越数千年依然具备终极兑现力。</span>
            </li><li class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
              <span class="flex-shrink-0 w-5 h-5 rounded-full bg-blue-100 text-blue-700 font-bold text-[10px] flex items-center justify-center mt-0.5">3</span>
              <span>心理锚定效应：沉甸甸的黄金能带来储蓄正反馈，帮助年轻人养成低频复利习惯。</span>
            </li>
      </ul>
    </div>
    <div class="pt-3 border-t border-slate-100 text-right text-xs text-slate-400">P4 / 正方立论</div>

  </div>
</body>
</html>
