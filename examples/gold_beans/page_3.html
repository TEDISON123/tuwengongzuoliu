<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .card-canvas {
      width: 540px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="card-canvas bg-white shadow-xl rounded-2xl flex flex-col justify-between p-8 border border-slate-200">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 tracking-wider">
        #理性讨论 · 财经认知
      </span>
      <span class="text-xs font-semibold text-slate-400 font-mono">
        3 / 6
      </span>
    </div>

    <div class="my-auto space-y-4">
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-red-600 uppercase tracking-wider">认知剪刀差</span>
          
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-purple-50 border border-purple-200 text-purple-700 text-[11px] font-bold">
          <span>🔬 穿透视角：硬核价值投资人</span>
        </div>

        </div>
        <h2 class="text-2xl font-black text-slate-900 leading-tight">黄金确实保值，但金豆不是投资金条</h2>
      </div>

      
        <div class="p-2.5 rounded-lg bg-purple-50/60 border-l-2 border-purple-400 text-[11px] text-purple-900 italic font-medium">
          “当防守资产被买成了香饽饽，最大的安全就变成了最大的风险。”
        </div>


      <div class="space-y-2.5">
        <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200">
          <div class="text-xs font-bold text-emerald-700 mb-1 flex items-center gap-1">
            <span>👀 看得见的算计（显性账）：</span>
          </div>
          <p class="text-xs text-emerald-900 leading-relaxed font-medium">每克几百元无痛上车，克重看得见摸得着，治好了年轻人的乱花钱消费瘾。</p>
        </div>

        <div class="p-3 rounded-xl bg-red-50 border border-red-200">
          <div class="text-xs font-bold text-red-700 mb-1 flex items-center gap-1">
            <span>⚠️ 看不见的代价（隐性账）：</span>
          </div>
          <p class="text-xs text-red-900 leading-relaxed font-medium">工艺费+损耗费+回购门槛，让微型金豆的实际持仓成本远超标准投资金条。</p>
        </div>
      </div>

      <div class="p-3 rounded-lg bg-slate-900 text-white text-center text-xs font-bold leading-relaxed">
        你买的究竟是'抗通胀黄金'，还是包裹着黄金外衣的'情绪消费品'？
      </div>
    </div>
    <div class="pt-3 border-t border-slate-100 text-right text-xs text-slate-400">P3 / 冲突本质</div>

  </div>
</body>
</html>
