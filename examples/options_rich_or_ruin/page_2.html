<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .card-canvas {
      width: 540px;
      height: 720px;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="card-canvas bg-white shadow-xl rounded-2xl flex flex-col justify-between p-8 border border-slate-200">
    
    <!-- Top Header Bar -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 tracking-wider">
        #理性讨论 · 财经认知
      </span>
      <span class="text-xs font-semibold text-slate-400 font-mono">
        2 / 6
      </span>
    </div>

    <div class="my-auto space-y-4">
      <div class="space-y-1">
        <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">现实痛点拆解 · 真实利差</span>
        <h2 class="text-2xl font-black text-slate-900 leading-tight">上午赚300%，下午本金归零</h2>
      </div>
      <p class="text-xs text-slate-600 leading-relaxed">无数人被'几十倍杠杆'吸引进场，面对每天剧烈跳动的期权权利金，真实体感往往是：</p>
      
      <div class="space-y-2">
        <div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 border border-slate-100">
              <span class="font-bold text-xs text-slate-700">买方看涨期权 (虚值合约)</span>
              <span class="text-xs font-semibold text-slate-500">动态杠杆比率 30x~100x</span>
              <span class="font-mono font-bold text-xs text-red-500">单日波动 ±200%~1000%</span>
            </div><div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 border border-slate-100">
              <span class="font-bold text-xs text-slate-700">Theta时间价值自然流逝</span>
              <span class="text-xs font-semibold text-slate-500">临近到期前最后15天</span>
              <span class="font-mono font-bold text-xs text-red-500">每日加速贬值 3%~8%</span>
            </div><div class="flex items-center justify-between p-3 rounded-lg bg-slate-50 border border-slate-100">
              <span class="font-bold text-xs text-slate-700">散户买方到期清零概率</span>
              <span class="text-xs font-semibold text-slate-500">全球交易所长周期统计</span>
              <span class="font-mono font-bold text-xs text-red-500">实测超 82.4% 终值归零</span>
            </div>
      </div>

      <div class="p-3 rounded-xl bg-amber-500/10 border-l-4 border-amber-500 text-xs text-amber-900 font-medium leading-relaxed">
        💡 上午赚300%感觉巴菲特不如我，下午归零发现连饭钱都没了，普通人玩期权到底是在搞投资还是在送人头？
      </div>
    </div>
    <div class="pt-3 border-t border-slate-100 text-right text-xs text-slate-400">P2 / 痛点账本</div>

  </div>
</body>
</html>
